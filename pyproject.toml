[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semopkt"
version = "1.0.0"
description = "Anonymous reproducibility package for semantic-field knowledge tracing"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3.1",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<1.9",
  "PyYAML>=6.0,<7",
  "pyarrow>=15,<22",
  "torch>=2.2,<2.7",
  "transformers>=4.41,<5",
  "sentence-transformers>=3.0,<4",
  "safetensors>=0.4,<1",
  "tqdm>=4.66,<5",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1"
]

[project.scripts]
semopkt = "semopkt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
