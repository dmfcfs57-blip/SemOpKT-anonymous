dataset: Assist09
raw_globs:
  - skill_builder_data_corrected.csv
  - "*.csv"
separator: ","
column_aliases:
  student_id: [user_id, student_id, user]
  question_id: [problem_id, question_id, item_id]
  kc_id: [skill_id, kc_id, skill_name]
  kc_text: [skill_name, kc_text, concept_name]
  correct: [correct, is_correct, label]
  timestamp: [order_id, start_time, timestamp, row]
multi_kc_delimiters: ["~~", ";", "|"]
multi_kc_joiner: " [SEP] "
minimum_student_interactions: 6
maximum_student_interactions: 50
expected_raw_statistics:
  students: 3644
  interactions: 282071
  questions: 17727
  concepts: 123
  median_interactions_per_student: 25
  median_concepts_per_student: 5
