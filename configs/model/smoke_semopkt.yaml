name: SemOpKT
text_encoder:
  backend: hash
  model_id: deterministic-token-hash-v1
  revision: sha256-blake2b-token-projection
  license: repository-MIT
  max_length: 64
  pooling: mean
  normalize: true
  instruction_prefix: ""
  cache_normalization: unicode_nfkc_casefold_whitespace
split_encoder:
  backend: hash
  model_id: deterministic-token-hash-v1-independent
  revision: sha256-blake2b-token-projection-split
  license: repository-MIT
  max_length: 64
  pooling: mean
  normalize: true
dimensions:
  text: 32
  semantic: 16
  field: 16
  context: 24
  attention: 8
  response: 4
  hidden: 32
architecture:
  inducing_points: 8
  layers: 1
  rank: 2
  dropout: 0.0
  interpolation_temperature: 1.0
  learnable_temperature: true
  direct_coordinate_path: true
  response_conditioning: true
  anchor_initialization: kmeans_plus_plus
  trainable_anchors: true
  trainable_concept_embeddings: false
  normalize_anchors_after_step: true
  population_prior_initialization: zeros
  layer_sharing: false
  epsilon: 1.0e-8
regularization:
  smoothness: 1.0e-4
  stability: 1.0e-4
  graph_neighbors: 3
  graph_metric: cosine
  graph_weight: rbf
  graph_rbf_temperature: 0.20
  graph_symmetrize: union_mean
  graph_self_loops: false
training:
  optimizer: AdamW
  learning_rate: 3.0e-3
  weight_decay: 1.0e-5
  batch_size: 8
  max_epochs: 3
  patience: 2
  gradient_clip: 5.0
  precision: fp32
  deterministic: true
  selection_metric: nll
  num_workers: 0
  max_sequence_length: 20
